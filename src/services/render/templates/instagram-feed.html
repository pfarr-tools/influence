<section class="panel">
  <div class="accent-line"></div>
  {{#if title}}
  <h1 class="title" data-overflow-id="title">{{title}}</h1>
  {{/if}} {{#if titleNote}}
  <p class="title-note" data-overflow-id="title-note">{{titleNote}}</p>
  {{/if}} {{#unless titleCard}} {{#if primaryText}}
  <p class="body-text" data-overflow-id="primary-text">{{{primaryText}}}</p>
  {{/if}} {{#if citation}}
  <div class="citation">{{citation}}</div>
  {{/if}} {{#if secondaryText}}
  <p class="small-text" data-overflow-id="secondary-text">{{secondaryText}}</p>
  {{/if}} {{/unless}}
  <p class="sender-mark">christoph-fischer.de</p>
</section>
