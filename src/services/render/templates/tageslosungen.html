<section class="panel tageslosungen-panel">
  <div class="accent-line"></div>
  {{#if title}}
  <h1 class="title" data-overflow-id="title">{{title}}</h1>
  {{/if}}
  {{#if primaryText}}
  <p class="body-text" data-overflow-id="primary-text">{{{primaryText}}}</p>
  {{/if}}
  {{#if citation}}
  <div class="citation" data-overflow-id="citation">{{citation}}</div>
  {{/if}}
  {{#if secondaryText}}
  <p class="body-text" data-overflow-id="secondary-text">{{secondaryText}}</p>
  {{/if}}
  {{#if secondaryCitation}}
  <div class="citation" data-overflow-id="secondary-citation">{{secondaryCitation}}</div>
  {{/if}}
  <p class="sender-mark">losungen.de / christoph-fischer.de</p>
</section>
