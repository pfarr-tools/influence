name: influence

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${INFLUENCE_UID:-1000}
        GID: ${INFLUENCE_GID:-1000}
    working_dir: /app
    env_file:
      - path: config/.env
        required: false
    environment:
      CONTENT_CALENDAR_PATH: /app/content/content-plan.json
      OUTPUT_DIR: /app/content
      TOKEN_STORE_PATH: /var/lib/influence/tokens.json
      TZ: ${TZ:-Europe/Berlin}
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: user.name
      GIT_CONFIG_VALUE_0: ${GIT_USER_NAME:-Influence}
      GIT_CONFIG_KEY_1: user.email
      GIT_CONFIG_VALUE_1: ${GIT_USER_EMAIL:-influence@example.invalid}
    volumes:
      - .:/app
      - influence_node_modules:/app/node_modules
      - ${INFLUENCE_RUNTIME_DIR:-../influence-runtime}:/var/lib/influence
    ports:
      - "${INFLUENCE_REVIEW_PORT:-3040}:3040"
    command: ["sleep", "infinity"]

volumes:
  influence_node_modules:
